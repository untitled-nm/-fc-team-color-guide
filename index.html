<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FC 팀컬러 도감</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#131e31;--panel2:#1a2941;--line:#2b3d59;--text:#eef4ff;--muted:#9db0cc;--accent:#69a7ff;--green:#54d6a0}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#09111f,#101d32);color:var(--text);font-family:Arial,"Noto Sans KR",sans-serif;min-height:100vh}
header{padding:30px 20px 22px;text-align:center;border-bottom:1px solid var(--line);background:#101b2d}
h1{margin:0 0 8px;font-size:28px}
header p{margin:0;color:var(--muted)}
main{max-width:1050px;margin:28px auto;padding:0 16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px}
h2{font-size:18px;margin:0 0 8px}
.hint{color:var(--muted);font-size:13px;margin:0 0 16px}
#stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:9px}
.stat{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:11px 12px;border-radius:10px;text-align:left;cursor:pointer;font-size:14px}
.stat:hover{border-color:var(--accent)}
.stat.active{background:#24466f;border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
button.action{border:1px solid #397bc6;background:#2863a8;color:var(--text);border-radius:9px;padding:11px 13px;font-size:14px;cursor:pointer;font-weight:700}
button.secondary{background:#24344c;border-color:var(--line)}
#summary{color:var(--muted);font-size:13px;margin-bottom:12px}
.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.card{background:#101b2c;border:1px solid var(--line);border-radius:12px;padding:15px}
.card h3{font-size:16px;margin:0 0 9px}
.kind{font-size:11px;color:#a9c9ff;background:#203b5e;padding:4px 8px;border-radius:20px;margin-left:7px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tag{font-size:12px;color:#c6d6ed;background:#23334a;padding:5px 8px;border-radius:7px}
.meta{font-size:12px;color:var(--muted);line-height:1.6}
.empty{color:var(--muted);padding:24px;text-align:center}
footer{text-align:center;color:#7186a4;font-size:12px;padding:22px}
@media(max-width:600px){h1{font-size:23px}.panel{padding:15px}}
</style>
</head>

<header>
<h1>⚽ FC 팀컬러 도감</h1>
<p>선수 능력치를 선택하고 조건에 맞는 팀컬러를 찾아보세요.</p>
</header>

<main>
<section class="panel">
<h2>능력치 선택</h2>
<p class="hint">여러 능력치를 선택하면 선택한 능력치를 모두 개별 +3으로 올려주는 팀컬러만 검색합니다.</p>
<div id="stats"></div>
<div class="controls">
<button class="action" id="search">선택 조건 검색</button>
<button class="action secondary" id="reset">초기화</button>
</div>
</section>

<section class="panel">
<h2>검색 결과</h2>
<div id="summary">능력치를 선택하고 검색해 주세요.</div>
<div id="results" class="results">
<div class="empty">아직 선택된 능력치가 없습니다.</div>
</div>
</section>
</main>

const statNames = [...new Set(rows.map(r => r[0]))];
const statsEl = document.getElementById("stats");
const selected = new Set();

statNames.forEach(stat => {
  const button = document.createElement("button");
  button.className = "stat";
  button.textContent = stat;
  button.type = "button";

  button.addEventListener("click", () => {
    if (selected.has(stat)) {
      selected.delete(stat);
      button.classList.remove("active");
    } else {
      selected.add(stat);
      button.classList.add("active");
    }
  });

  statsEl.appendChild(button);
});

function escapeHtml(value) {
  return value.replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function search() {
  const chosen = [...selected];

  const result = teams.filter(team =>
    chosen.length > 0 &&
    chosen.every(stat => team.boosts.includes(stat))
  );

  const sorted = result.sort((a, b) =>
    b.boosts.length - a.boosts.length ||
    a.name.localeCompare(b.name, "ko")
  );

  document.getElementById("summary").textContent =
    chosen.length
      ? `선택 능력치: ${chosen.join(", ")} · 검색 결과 ${sorted.length}개`
      : "능력치를 하나 이상 선택해 주세요.";

  document.getElementById("results").innerHTML =
    chosen.length
      ? sorted.map(team => `
        <article class="card">
          <h3>${escapeHtml(team.name)}
            <span class="kind">${team.kind}</span>
          </h3>
          <div class="tags">
            ${team.boosts.map(stat =>
              `<span class="tag">${escapeHtml(stat)} +3</span>`
            ).join("")}
          </div>
          <div class="meta">
            수집된 원본 항목: ${team.sources.size}개 · 전체 능력치 +4
          </div>
        </article>
      `).join("") ||
      '<div class="empty">선택한 능력치를 모두 올려주는 팀컬러가 없습니다.</div>'
      : '<div class="empty">능력치를 선택하고 검색해 주세요.</div>';
}

document.getElementById("search").addEventListener("click", search);

document.getElementById("reset").addEventListener("click", () => {
  selected.clear();

  document.querySelectorAll(".stat").forEach(button => {
    button.classList.remove("active");
  });

  document.getElementById("summary").textContent =
    "능력치를 선택하고 검색해 주세요.";

  document.getElementById("results").innerHTML =
    '<div class="empty">아직 선택된 능력치가 없습니다.</div>';
});
</script>
</body>
</html>
