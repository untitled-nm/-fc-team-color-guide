<!DOCTYPE html>

<head>

<title>FC 팀컬러 도감</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#131e31;--panel2:#1a2941;--line:#2b3d59;--text:#eef4ff;--muted:#9db0cc;--accent:#69a7ff;--green:#54d6a0}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#09111f,#101d32);color:var(--text);font-family:Arial,"Noto Sans KR",sans-serif;min-height:100vh}
header{text-align:center;padding:32px 16px 25px;background:#101b2d;border-bottom:1px solid var(--line)}h1{margin:0 0 8px;font-size:28px}header p{margin:0;color:var(--muted)}
main{max-width:1100px;margin:28px auto;padding:0 16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px}
h2{font-size:19px;margin:0 0 8px}.hint{color:var(--muted);font-size:13px;margin:0 0 16px}
#stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:9px}.stat{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:11px;border-radius:10px;text-align:center;cursor:pointer;font-size:14px}
.stat.active{background:#24466f;border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.action{border:1px solid #397bc6;background:#2863a8;color:white;border-radius:9px;padding:11px 16px;font-size:14px;cursor:pointer;font-weight:700}.secondary{background:#24344c;border-color:var(--line)}
.options{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:14px}.options label{display:flex;gap:7px;align-items:center}
#summary{color:var(--muted);font-size:13px;margin-bottom:12px}.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.card{background:#101b2c;border:1px solid var(--line);border-radius:12px;padding:15px}.card h3{font-size:16px;margin:0 0 9px}
.kind{font-size:11px;color:#a9c9ff;background:#203b5e;padding:4px 8px;border-radius:20px;margin-left:7px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.tag{font-size:12px;color:#c6d6ed;background:#23334a;padding:5px 8px;border-radius:7px}
.meta{font-size:12px;color:var(--muted);line-height:1.6}.empty{color:var(--muted);padding:24px;text-align:center}
.searchrow{display:flex;gap:9px;margin-bottom:14px}.searchrow input{width:100%;min-width:0;background:#0d1727;border:1px solid var(--line);border-radius:9px;padding:11px;color:var(--text);font-size:14px}
@media(max-width:600px){h1{font-size:23px}.panel{padding:15px}.searchrow{flex-direction:column}}
footer{text-align:center;color:#7186a4;font-size:12px;padding:22px}
</style>
</head>

<header><h1>⚽ FC 팀컬러 도감</h1><p>원하는 선수 능력치를 선택하고 조건에 맞는 팀컬러를 찾아보세요.</p></header>

<div class="options"><label><input type="checkbox" id="includeOverall"> 전체 능력치 +4도 검색 조건에 포함</label></div>
<div class="controls"><button class="action" id="search">선택 조건 검색</button><button class="action secondary" id="reset">초기화</button></div>
</section>
<section class="panel">

</section>
</main>

 btn.type="button";btn.className="stat";btn.textContent=stat;
 btn.addEventListener("click",()=>{
  if(selected.has(stat)){selected.delete(stat);btn.classList.remove("active")}
  else{selected.add(stat);btn.classList.add("active")}
  if(hasSearched) render();
 });
 statsEl.appendChild(btn);
});

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function render(){
 const chosen=[...selected];
 const keyword=keywordEl.value.trim().toLocaleLowerCase();
 const includeOverall=document.getElementById("includeOverall").checked;
 let found=DATA.teams.filter(t=>{
  const statMatch=chosen.length===0 ? true : chosen.every(s=>t.boosts[s]===3 || includeOverall);
  const nameMatch=!keyword || t.name.toLocaleLowerCase().includes(keyword);
  return statMatch && nameMatch;
 });
 found.sort((a,b)=>a.name.localeCompare(b.name,"ko"));
 summaryEl.textContent=`선택 능력치 ${chosen.length}개 · 검색 결과 ${found.length}개 팀컬러`;
 resultsEl.innerHTML=found.length?found.map(t=>{
  const boostNames=Object.keys(t.boosts);
  return `<article class="card"><h3>${esc(t.name)}<span class="kind">${esc(t.type)}</span></h3>
  <div class="tags">${boostNames.map(s=>`<span class="tag">${esc(s)} +${t.boosts[s]}</span>`).join("")}</div>
  <div class="meta">전체 능력치 +${t.overall} · 개별 상승 능력치 ${boostNames.length}종</div></article>`;
 }).join(""):'<div class="empty">조건에 맞는 팀컬러가 없습니다.</div>';
}
document.getElementById("search").addEventListener("click",()=>{hasSearched=true;render();});
document.getElementById("reset").addEventListener("click",()=>{
 selected.clear();hasSearched=false;keywordEl.value="";
 document.querySelectorAll(".stat").forEach(b=>b.classList.remove("active"));
 summaryEl.textContent="능력치를 선택하고 검색해 주세요.";
 resultsEl.innerHTML='<div class="empty">아직 선택된 능력치가 없습니다.</div>';
});
keywordEl.addEventListener("input",()=>{if(hasSearched)render();});
document.getElementById("includeOverall").addEventListener("change",()=>{if(hasSearched)render();});
</script>
</body></html>
